name: Sincronizar Sorteos Astro (Cron)

on:
  schedule:
    # Astro Sol (~2:30 PM COT = 19:30 UTC) -> ejecutar 20:05 UTC (3:05 PM COT)
    - cron: '5 20 * * *'
    # Astro Luna (~10:50 PM COT = 03:50 UTC) -> ejecutar 04:15 UTC (11:15 PM COT)
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validar configuración de secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan secrets APP_URL o CRON_SECRET en GitHub."
            exit 1
          fi

      - name: Despertar instancia en Render Free (/health)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 12 --retry-all-errors \
            --max-time 60 "${APP_URL%/}/health"

      - name: Disparar sincronización segura de sorteos
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --max-time 90 -X POST "${APP_URL%/}/api/cron/sync" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json"
